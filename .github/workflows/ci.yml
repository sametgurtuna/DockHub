name: CI

on:
  push:
    branches: [master, 'claude/**']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CustomDock.sln

      - name: Build
        run: dotnet build CustomDock.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test CustomDock.sln -c Release --no-build --logger trx --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'

  widget-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Widget tool tests
        run: node --test tools/dockhub-widget/test.mjs

      - name: Type-check the sample widgets
        run: |
          npm install --global typescript@5
          node sdk/check-samples.mjs
