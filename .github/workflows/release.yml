name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/CustomDock/CustomDock.csproj
          $version = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -ne $tag) { throw "Tag v$tag does not match CustomDock.csproj version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test CustomDock.sln -c Release

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Code signing is optional: without the secrets and variables in packaging/signing/README.md the release is
      # built exactly as before, unsigned, with a warning.
      - name: Check code signing
        id: signing
        shell: pwsh
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
        run: |
          if ($env:CLIENT_ID -and $env:ACCOUNT) {
            "enabled=true" >> $env:GITHUB_OUTPUT
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Output "::warning::Code signing is not set up, so this release is unsigned (see packaging/signing/README.md)."
          }

      # One setup for each processor: x64, and arm64 for Windows 11 on ARM.
      - name: Publish
        shell: pwsh
        run: |
          pwsh installer/build.ps1 -Stage Publish -Runtime win-x64
          pwsh installer/build.ps1 -Stage Publish -Runtime win-arm64

      - name: Sign DockHub
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\artifacts\publish\win-x64\DockHub.exe
            ${{ github.workspace }}\artifacts\publish\win-x64\DockHub.dll
            ${{ github.workspace }}\artifacts\publish\win-arm64\DockHub.exe
            ${{ github.workspace }}\artifacts\publish\win-arm64\DockHub.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build installers
        shell: pwsh
        run: |
          pwsh installer/build.ps1 -Stage Installer -Runtime win-x64
          pwsh installer/build.ps1 -Stage Installer -Runtime win-arm64

      - name: Sign installer
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\installer\Output\DockHub-Setup-${{ env.VERSION }}-x64.exe
            ${{ github.workspace }}\installer\Output\DockHub-Setup-${{ env.VERSION }}-arm64.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signatures
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $files = @()
          foreach ($arch in 'x64', 'arm64') {
            $files += "artifacts/publish/win-$arch/DockHub.exe", "artifacts/publish/win-$arch/DockHub.dll", "installer/Output/DockHub-Setup-$env:VERSION-$arch.exe"
          }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "$file is not signed correctly: $($signature.Status) $($signature.StatusMessage)" }
            Write-Output "$file signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Checksum
        shell: pwsh
        run: |
          $lines = foreach ($arch in 'x64', 'arm64') {
            $name = "DockHub-Setup-$env:VERSION-$arch.exe"
            $hash = (Get-FileHash "installer/Output/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $lines | Out-File installer/Output/SHA256SUMS.txt -Encoding ascii

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: DockHub ${{ env.VERSION }}
          body_path: docs/release-notes/v${{ env.VERSION }}.md
          files: |
            installer/Output/DockHub-Setup-${{ env.VERSION }}-x64.exe
            installer/Output/DockHub-Setup-${{ env.VERSION }}-arm64.exe
            installer/Output/SHA256SUMS.txt

  macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build release
        run: swift build -c release

      - name: Package DMG
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x Scripts/*.sh
          ./Scripts/package-dmg.sh release
          cp .build/DockHub.dmg ".build/DockHub-${{ env.VERSION }}.dmg"

      - name: Checksum
        run: |
          shasum -a 256 ".build/DockHub-${{ env.VERSION }}.dmg" > ".build/DockHub-${{ env.VERSION }}.dmg.sha256"

      - name: Draft release asset
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            macos/.build/DockHub-${{ env.VERSION }}.dmg
            macos/.build/DockHub-${{ env.VERSION }}.dmg.sha256

