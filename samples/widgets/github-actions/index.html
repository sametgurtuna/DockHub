<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: var(--dh-font, "Segoe UI", sans-serif); color: var(--dh-text, #fff);
    display: flex; align-items: center; gap: 10px; padding: 0 12px; box-sizing: border-box; cursor: pointer; user-select: none;
  }
  .status { flex: none; width: 14px; height: 14px; border-radius: 50%; background: rgba(127, 127, 127, .5); }
  .status.success { background: #3fb950; }
  .status.failure { background: #f85149; }
  .status.running { background: #d29922; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
  .label { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail { font-size: 11px; color: var(--dh-text-secondary, #aaa); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  html[data-size="compact"] body { justify-content: center; padding: 0; }
  html[data-size="compact"] .text { display: none; }
  html[data-size="compact"] .status { width: 18px; height: 18px; }
</style>
</head>
<body>
  <div class="status" id="status"></div>
  <div class="text">
    <div class="label" id="label">GitHub Actions</div>
    <div class="detail" id="detail">Loading…</div>
  </div>
<script>
  let settings = { repo: '', workflow: '', branch: '', token: '', minutes: 5, notify: true };
  let timer;
  let last = null; // { id, state } of the previous refresh, so the first one doesn't notify
  let runUrl = null;

  const repo = () => (settings.repo || '').trim().replace(/^https:\/\/github\.com\//, '').replace(/\/+$/, '');
  const actionsPage = () => repo() ? `https://github.com/${repo()}/actions` : 'https://github.com';

  async function api(path) {
    const headers = { Accept: 'application/vnd.github+json' };
    if (settings.token) headers.Authorization = `Bearer ${settings.token.trim()}`;
    const response = await fetch(`https://api.github.com${path}`, { headers });
    if (response.status === 401) throw new Error('The token was not accepted.');
    if (response.status === 403) throw new Error('GitHub rate limit reached. Add a token or refresh less often.');
    if (response.status === 404) throw new Error('Repository or workflow not found (a private one needs a token).');
    if (!response.ok) throw new Error(`GitHub answered ${response.status}.`);
    return response.json();
  }

  // queued / in_progress / waiting → running; completed → its conclusion
  function stateOf(run) {
    if (run.status !== 'completed') return 'running';
    if (run.conclusion === 'success') return 'success';
    if (['failure', 'timed_out', 'startup_failure'].includes(run.conclusion)) return 'failure';
    return 'other';
  }

  function ago(iso) {
    const minutes = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (minutes < 1) return 'just now';
    if (minutes < 60) return `${minutes} min ago`;
    const hours = Math.round(minutes / 60);
    return hours < 48 ? `${hours} h ago` : `${Math.round(hours / 24)} days ago`;
  }

  const WORDS = { success: 'passing', failure: 'failing', running: 'running', other: 'finished' };

  function render(run, error) {
    const status = document.getElementById('status');
    status.className = 'status' + (run ? ' ' + stateOf(run) : '');
    if (error || !run) {
      document.getElementById('label').textContent = repo() || 'GitHub Actions';
      document.getElementById('detail').textContent = error || 'No runs yet';
      document.body.title = error || 'No runs yet';
      return;
    }
    const state = stateOf(run);
    const word = state === 'other' ? (run.conclusion || WORDS.other) : WORDS[state];
    document.getElementById('label').textContent = run.name;
    document.getElementById('detail').textContent = `${word} · ${run.head_branch} · ${ago(run.updated_at)}`;
    document.body.title = `${repo()}\n${run.name}: ${word}\n${run.display_title}\n${run.head_branch}, ${ago(run.updated_at)}`;
  }

  async function load() {
    if (!repo().includes('/')) {
      render(null, 'Set the repository (owner/name) in the widget settings.');
      return;
    }
    try {
      const branch = (settings.branch || '').trim();
      const query = `per_page=1${branch ? `&branch=${encodeURIComponent(branch)}` : ''}`;
      const workflow = (settings.workflow || '').trim();
      const path = workflow
        ? `/repos/${repo()}/actions/workflows/${encodeURIComponent(workflow)}/runs?${query}`
        : `/repos/${repo()}/actions/runs?${query}`;
      const run = (await api(path)).workflow_runs[0];
      runUrl = run ? run.html_url : null;
      render(run);

      if (run) {
        const state = stateOf(run);
        if (last && settings.notify && state !== 'running' && (last.id !== run.id || last.state !== state)) {
          if (state === 'failure') dockhub.notify({ title: `${run.name} failed`, body: `${repo()} · ${run.head_branch}: ${run.display_title}` });
          else if (state === 'success' && last.state === 'failure') dockhub.notify({ title: `${run.name} is passing again`, body: `${repo()} · ${run.head_branch}` });
        }
        // A running run keeps the previous result, so "failed → running → passed" still counts as fixed.
        if (state !== 'running') last = { id: run.id, state };
        else if (!last) last = { id: null, state: 'running' };
      }
    } catch (e) {
      render(null, e.message);
    }
  }

  function schedule() {
    clearInterval(timer);
    timer = setInterval(load, Math.max(1, Number(settings.minutes) || 5) * 60 * 1000);
  }

  (async () => {
    settings = { ...settings, ...(await dockhub.settings.get()) };
    document.documentElement.dataset.size = dockhub.size;
    dockhub.onSize(size => document.documentElement.dataset.size = size);
    dockhub.settings.onChange(values => { settings = { ...settings, ...values }; last = null; load(); schedule(); });
    document.body.addEventListener('click', () => dockhub.openUrl(runUrl || actionsPage()));
    await dockhub.contextMenu.set([{ id: 'refresh', label: 'Refresh now' }, { id: 'actions', label: 'Open Actions' }]);
    dockhub.contextMenu.onSelect(id => id === 'refresh' ? load() : dockhub.openUrl(actionsPage()));
    load();
    schedule();
  })();
</script>
</body>
</html>
