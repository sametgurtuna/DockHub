<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body {
    font-family: var(--dh-font, "Segoe UI", sans-serif); color: var(--dh-text, #fff);
    display: flex; align-items: center; gap: 9px; padding: 0 12px; box-sizing: border-box; cursor: pointer; user-select: none;
  }
  svg { width: 20px; height: 20px; flex: none; fill: #f5c542; }
  .text { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
  .count { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .repo { font-size: 11px; color: var(--dh-text-secondary, #aaa); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>
  <div class="text">
    <div class="count" id="count">…</div>
    <div class="repo" id="repo"></div>
  </div>
<script>
  let settings = { repo: 'sametgurtuna/DockHub', minutes: 30 };
  let timer;

  async function load() {
    document.getElementById('repo').textContent = settings.repo;
    try {
      // Only api.github.com is allowed by the manifest; other hosts are blocked by DockHub.
      const response = await fetch(`https://api.github.com/repos/${settings.repo}`);
      if (!response.ok) throw new Error(response.status);
      const data = await response.json();
      document.getElementById('count').textContent = data.stargazers_count.toLocaleString();
    } catch {
      document.getElementById('count').textContent = '—';
    }
  }

  function schedule() {
    clearInterval(timer);
    timer = setInterval(load, Math.max(5, settings.minutes) * 60 * 1000);
  }

  (async () => {
    settings = { ...settings, ...(await dockhub.settings.get()) };
    dockhub.settings.onChange(values => { settings = { ...settings, ...values }; load(); schedule(); });
    document.body.addEventListener('click', () => dockhub.openUrl(`https://github.com/${settings.repo}`));
    load();
    schedule();
  })();
</script>
</body>
</html>
